name: Create Missing Boards
on:
  workflow_dispatch:

jobs:
  create-boards:
    runs-on: ubuntu-latest
    steps:
      - name: Create missing Pinterest boards
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          python3 - <<'EOF'
          import requests, json, os

          token = os.environ["PINTEREST_ACCESS_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          boards_to_create = [
              {
                  "name": "Morning Coffee Metabolism Tips for Women 40+",
                  "description": "Morning coffee metabolism tips and rituals for women over 40. Java Burn coffee protocol for hormonal weight loss.",
                  "privacy": "PUBLIC"
              },
              {
                  "name": "Java Burn Coffee Ritual Recipes",
                  "description": "Java Burn coffee ritual recipes and morning routines for women over 40. Natural metabolism boost with morning coffee.",
                  "privacy": "PUBLIC"
              }
          ]

          for board in boards_to_create:
              r = requests.post(
                  "https://api.pinterest.com/v5/boards",
                  json=board,
                  headers=headers,
                  timeout=30
              )
              print(f"Board '{board['name']}': {r.status_code} - {r.json()}")
          EOF
